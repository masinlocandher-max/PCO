name: Emergency remove stale custom domains from withlovefmb

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-vercel-domain-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Select existing Vercel API credential
        id: auth
        shell: bash
        env:
          VERCEL_TOKEN_1: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_2: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TOKEN_3: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          token=''
          for candidate in "$VERCEL_TOKEN_1" "$VERCEL_TOKEN_2" "$VERCEL_TOKEN_3"; do
            if [ -n "$candidate" ]; then token="$candidate"; break; fi
          done
          if [ -z "$token" ]; then
            echo '::error::No existing Vercel API token secret is available to this repository.'
            exit 2
          fi
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo 'Vercel API credential found.'

      - name: Inspect current Vercel project domains and FMB DNS
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          team='team_KRSlI8wfigrmTrcCfbLIu9C6'
          project='prj_NQROYIgMZ5bvNeRBhhH5wPTuGZeL'
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json')

          project_domains="$(curl --fail-with-body -sS "${auth[@]}" "${api}/v9/projects/${project}/domains?teamId=${team}&limit=100")"
          echo "$project_domains" | jq '{domains:(.domains|map(.name))}'
          echo "$project_domains" > /tmp/project-domains-before.json

          dns_code="$(curl -sS -o /tmp/vercel-dns-before.json -w '%{http_code}' "${auth[@]}" "${api}/v5/domains/francinemariebautista.com/records?teamId=${team}&limit=100")"
          if [ "$dns_code" = '200' ]; then
            echo 'FMB domain is still DNS-managed by Vercel.'
            jq '{records:(.records|map({id,type,name,value}))}' /tmp/vercel-dns-before.json
          elif [ "$dns_code" = '404' ]; then
            echo 'FMB domain is no longer DNS-managed by Vercel; DNS mutation steps will be skipped.'
            echo '{"records":[]}' > /tmp/vercel-dns-before.json
            touch /tmp/vercel-dns-unmanaged
          else
            echo "::error::Unable to inspect FMB DNS in Vercel; HTTP ${dns_code}."
            cat /tmp/vercel-dns-before.json || true
            exit 1
          fi

      - name: Point FMB apex and www DNS to GitHub Pages
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ -f /tmp/vercel-dns-unmanaged ]; then
            echo 'Skipped: francinemariebautista.com is no longer DNS-managed by Vercel.'
            exit 0
          fi

          api='https://api.vercel.com'
          team='team_KRSlI8wfigrmTrcCfbLIu9C6'
          domain='francinemariebautista.com'
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json')

          jq -r '.records[] | select((.name=="" or .name=="@" or .name=="www") and (["A","AAAA","ALIAS","ANAME","CNAME"] | index(.type))) | .id' /tmp/vercel-dns-before.json | while read -r id; do
            [ -n "$id" ] || continue
            curl --fail-with-body -sS -X DELETE "${auth[@]}" "${api}/v2/domains/${domain}/records/${id}?teamId=${team}" >/dev/null
            echo "Removed conflicting apex/www DNS record ${id}."
          done

          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            payload="$(jq -nc --arg value "$ip" '{type:"A",name:"",value:$value,ttl:60,comment:"PCO GitHub Pages canonical apex"}')"
            curl --fail-with-body -sS -X POST "${auth[@]}" "${api}/v2/domains/${domain}/records?teamId=${team}" --data "$payload" >/dev/null
            echo "Added GitHub Pages apex A ${ip}."
          done

          payload='{"type":"CNAME","name":"www","value":"masinlocandher-max.github.io","ttl":60,"comment":"PCO GitHub Pages canonical www"}'
          curl --fail-with-body -sS -X POST "${auth[@]}" "${api}/v2/domains/${domain}/records?teamId=${team}" --data "$payload" >/dev/null
          echo 'Added GitHub Pages www CNAME.'

      - name: Remove obsolete FMB subdomain DNS records
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ -f /tmp/vercel-dns-unmanaged ]; then
            echo 'Skipped: francinemariebautista.com is no longer DNS-managed by Vercel.'
            exit 0
          fi

          api='https://api.vercel.com'
          team='team_KRSlI8wfigrmTrcCfbLIu9C6'
          domain='francinemariebautista.com'
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json')

          jq -r '.records[] | select((.name=="app" or .name=="data" or .name=="yoni") and (["A","AAAA","ALIAS","ANAME","CNAME"] | index(.type))) | .id' /tmp/vercel-dns-before.json | while read -r id; do
            [ -n "$id" ] || continue
            curl --fail-with-body -sS -X DELETE "${auth[@]}" "${api}/v2/domains/${domain}/records/${id}?teamId=${team}" >/dev/null
            echo "Removed obsolete FMB subdomain DNS record ${id}."
          done

      - name: Detach stale custom domains from withlovefmb
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          team='team_KRSlI8wfigrmTrcCfbLIu9C6'
          project='prj_NQROYIgMZ5bvNeRBhhH5wPTuGZeL'
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json')

          domains=(
            francinemariebautista.com
            www.francinemariebautista.com
            app.francinemariebautista.com
            data.francinemariebautista.com
            yoni.francinemariebautista.com
            thecognitainstitute.com
            www.thecognitainstitute.com
          )

          for hostname in "${domains[@]}"; do
            if jq -e --arg host "$hostname" '.domains | map(.name) | index($host) != null' /tmp/project-domains-before.json >/dev/null; then
              code="$(curl -sS -o /tmp/vercel-delete-domain.json -w '%{http_code}' -X DELETE "${auth[@]}" "${api}/v9/projects/${project}/domains/${hostname}?teamId=${team}")"
              if [ "$code" != '200' ] && [ "$code" != '204' ]; then
                echo "::error::Failed to detach ${hostname}; HTTP ${code}."
                cat /tmp/vercel-delete-domain.json || true
                exit 1
              fi
              echo "Detached ${hostname} from withlovefmb."
            else
              echo "Already detached: ${hostname}."
            fi
          done

      - name: Verify Vercel cleanup
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          team='team_KRSlI8wfigrmTrcCfbLIu9C6'
          project='prj_NQROYIgMZ5bvNeRBhhH5wPTuGZeL'
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json')

          after="$(curl --fail-with-body -sS "${auth[@]}" "${api}/v9/projects/${project}/domains?teamId=${team}&limit=100")"
          echo "$after" | jq '{remaining_domains:(.domains|map(.name))}'

          for hostname in \
            francinemariebautista.com \
            www.francinemariebautista.com \
            app.francinemariebautista.com \
            data.francinemariebautista.com \
            yoni.francinemariebautista.com \
            thecognitainstitute.com \
            www.thecognitainstitute.com; do
            if echo "$after" | jq -e --arg host "$hostname" '.domains | map(.name) | index($host) != null' >/dev/null; then
              echo "::error::Custom domain still attached to withlovefmb: ${hostname}"
              exit 1
            fi
          done
          echo 'Vercel project cleanup verified. No stale custom domains remain attached.'

      - name: Verify public FMB root is no longer served by Vercel
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Public verification attempt ${attempt}"
            rm -f /tmp/root.h /tmp/root.html
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -D /tmp/root.h "https://francinemariebautista.com/?cutover=${GITHUB_SHA}-${attempt}" -o /tmp/root.html; then
              if grep -qi 'Francine' /tmp/root.html && ! tr -d '\r' < /tmp/root.h | grep -Eqi '^(server: Vercel|x-vercel-)'; then
                echo 'RESOLVED: francinemariebautista.com is no longer served by Vercel.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::warning::Vercel project cleanup succeeded, but public DNS/CDN propagation has not verified yet.'

# Trigger marker: 2026-09-07 idempotent post-detach verification.
