name: CV Lock

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  protect-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify owner-protected CV
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check-cv-lock.py
