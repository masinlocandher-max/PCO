name: Deploy PCO to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Requires Pages to be enabled once by hand:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # enablement: true does NOT work here. GITHUB_TOKEN can deploy to an
      # existing Pages site but cannot create one — that needs repo-admin
      # scope, which no `permissions:` block can grant. Enabling it in the
      # workflow fails with "Create Pages site failed. Error: Resource not
      # accessible by integration". Once Pages is on, this workflow deploys
      # on every push to main with no further setup.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production routing
        if: always()
        shell: bash
        run: |
          echo "=== Apex IPv4 resolution ==="
          getent ahostsv4 francinemariebautista.com || true
          echo "=== Apex HTTPS ==="
          curl -sSIL --max-time 20 https://francinemariebautista.com/ || true
          echo "=== FMB News HTTPS ==="
          curl -sSIL --max-time 20 https://www.francinemariebautista.com/news/ || true
