name: Deploy PCO to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout PCO
        uses: actions/checkout@v6

      - name: Enforce canonical deployment boundary
        shell: bash
        run: |
          set -euxo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "francinemariebautista.com"
          test ! -f vercel.json
          test ! -d .vercel
          grep -q 'masinlocandher-max/PCO' README.md
          grep -q 'masinlocandher-max/FMBNews' README.md
          grep -q 'FMBNews owns `/news' README.md
          ! find . -maxdepth 1 -type d -name news -print -quit | grep -q .
          ! grep -R -n -E 'FMB-Ecosystem' . \
            --include='*.html' --include='*.js' --include='*.css'

      - name: Validate shipped media and local references
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/validate-site-assets.py

      - name: Checkout pinned Filipino Media Bulletin source
        uses: actions/checkout@v6
        with:
          repository: masinlocandher-max/FilipinoMediaBulletin
          ref: b51decd513f7955d130d94c0719446c2c0bcf916
          path: _fmb-bulletin-source
          persist-credentials: false

      - name: Build independent FMB bulletin at /filipinomediabulletin
        shell: bash
        env:
          FMB_SITE_URL: https://francinemariebautista.com/filipinomediabulletin
          FMB_LAUNCH: 'false'
        run: |
          set -euo pipefail
          cd _fmb-bulletin-source
          npm test
          npm run build
          test -f dist/index.html
          test -f dist/archive/index.html
          test -f dist/sources/index.html
          test -s dist/editorial.css
          grep -q 'class="publication-name">Filipino Media Bulletin' dist/index.html
          grep -q 'class="visual-hero"' dist/index.html
          grep -q 'class="bulletin-glass"' dist/index.html
          grep -q 'noindex, nofollow' dist/index.html
          grep -q 'href="/filipinomediabulletin/styles.css"' dist/index.html
          grep -q 'src="/filipinomediabulletin/client.js"' dist/index.html

      - name: Stage canonical PCO root only
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '_fmb-bulletin-source'
          test "$(tr -d '\r\n' < _site/CNAME)" = "francinemariebautista.com"
          test -f _site/index.html
          test ! -d _site/news
          # Mount only FMB's compiled public files; the PCO portfolio and
          # legacy Cloudflare /news archive stay separately owned.
          mkdir -p _site/filipinomediabulletin
          rsync -a _fmb-bulletin-source/dist/ _site/filipinomediabulletin/ --exclude 'robots.txt'
          test -f _site/filipinomediabulletin/index.html
          test -s _site/filipinomediabulletin/editorial.css
          test -f _site/filipinomediabulletin/archive/index.html
          test ! -d _site/filipinomediabulletin/.git
          test ! -d _site/filipinomediabulletin/data
          grep -q 'noindex, nofollow' _site/filipinomediabulletin/index.html


      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload PCO root artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy PCO root to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production ownership and routing
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PCO root ==="
          rm -f /tmp/pco-root.h /tmp/pco-root.html
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            -D /tmp/pco-root.h \
            "https://francinemariebautista.com/?pages=${GITHUB_SHA}" \
            -o /tmp/pco-root.html
          grep -qi 'Francine' /tmp/pco-root.html
          if tr -d '\r' < /tmp/pco-root.h | grep -Eqi '^(server: Vercel|x-vercel-)'; then
            echo '::error::Canonical root is still being served by Vercel instead of the PCO/GitHub Pages origin path.'
            cat /tmp/pco-root.h
            exit 1
          fi

          echo "=== Filipino Media Bulletin independent route ==="
          fmb_confirmed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://francinemariebautista.com/filipinomediabulletin/?release=${GITHUB_SHA}-${attempt}" \
              -o /tmp/fmb-bulletin.html; then
              if grep -qi 'Filipino Media Bulletin' /tmp/fmb-bulletin.html && \
                grep -q '/filipinomediabulletin/styles.css' /tmp/fmb-bulletin.html && \
                grep -q 'noindex, nofollow' /tmp/fmb-bulletin.html; then
                fmb_confirmed=1
                break
              fi
            fi
            sleep 5
          done
          test "$fmb_confirmed" = "1" || { echo '::error::FMB subpath not reachable from canonical PCO origin'; exit 1; }
          curl --fail --location --silent --show-error \
            "https://francinemariebautista.com/filipinomediabulletin/styles.css" \
            -o /tmp/fmb-bulletin.css
          test -s /tmp/fmb-bulletin.css
          curl --fail --location --silent --show-error \
            "https://francinemariebautista.com/filipinomediabulletin/editorial.css" \
            -o /tmp/fmb-editorial.css
          test -s /tmp/fmb-editorial.css
          grep -q 'visual-hero' /tmp/fmb-editorial.css
          grep -q 'publication-name' /tmp/fmb-bulletin.html
          echo 'FMB subpath home and stylesheet verified; legacy /news remains separate.'

          echo "=== FMB News edge route ==="
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/news.h /tmp/news.html
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/news.h \
              "https://www.francinemariebautista.com/news/?ownership=${GITHUB_SHA}-${attempt}" \
              -o /tmp/news.html; then
              if grep -qi 'FMB News' /tmp/news.html && \
                 grep -qi 'Filipino Media Bulletin' /tmp/news.html && \
                 tr -d '\r' < /tmp/news.h | grep -Eqi '^x-fmb-news-worker: fmb-news$'; then
                echo 'RESOLVED: PCO owns the root; FMBNews Worker owns /news at the Cloudflare edge.'
                exit 0
              fi
            fi
            sleep 5
          done

          echo '::error::Canonical ownership check failed: /news is not confirmed on the FMBNews Worker.'
          cat /tmp/news.h || true
          head -c 500 /tmp/news.html || true
          exit 1
