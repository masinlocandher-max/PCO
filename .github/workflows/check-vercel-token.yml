name: Check Vercel token availability

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/check-vercel-token.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check configured Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_STATUS=missing"
            exit 2
          fi
          echo "VERCEL_TOKEN_STATUS=present"
