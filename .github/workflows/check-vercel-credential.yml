name: Check PCO Vercel credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-vercel-credential.yml'

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'Check PCO Vercel credential'
    runs-on: ubuntu-latest
    steps:
      - name: Check credential presence only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo 'PCO_VERCEL_TOKEN_PRESENT=true'
          else
            echo 'PCO_VERCEL_TOKEN_PRESENT=false'
            exit 1
          fi
