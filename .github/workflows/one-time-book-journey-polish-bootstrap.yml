name: Bootstrap book journey polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-book-journey-polish-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enable polish workflow and clean bootstrap
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/if: github.actor != 'github-actions\[bot\]'/d" .github/workflows/one-time-book-journey-polish.yml
          rm -f .github/workflows/one-time-book-journey-polish-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-book-journey-polish.yml .github/workflows/one-time-book-journey-polish-bootstrap.yml
          git commit -m 'Enable one-time book journey polish'
          git push origin HEAD:main
