name: Run book journey polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-book-journey-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply polish
        run: python3 scripts/one-time-book-journey-polish.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check book/book.js
          node --check book/reader.js
          grep -q 'A note from FMB' book/reader.js
          grep -q 'FMB iOS-motion polish v1' book/scroll-fix.css
          grep -q 'FMB reader iOS polish v1' book/reader.css
          grep -q "trwtl-v4" book/sw.js
          python3 scripts/validate-site-assets.py
      - name: Commit book journey polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/index.html book/book.js book/scroll-fix.css book/reader.html book/reader.js book/reader.css book/auth-callback.html book/offline.html book/sw.js
          git commit -m 'Polish book journey with iOS motion and FMB reader ending'
          git push origin HEAD:main
