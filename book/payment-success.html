<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fbf5e8">
  <title>Payment confirmation | The Right Way to Live</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:22px;background:#f4ede3;color:#241d19;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}.card{width:min(500px,100%);padding:30px;border:1px solid #ded1c2;border-radius:26px;background:#fffdf9;box-shadow:0 22px 70px rgba(43,28,15,.09);text-align:center}.mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 19px;border-radius:19px;background:#220d50;color:#fff}.mark:before{content:"";width:20px;height:20px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}body.is-paid .mark:before{width:18px;height:10px;border:0;border-left:2px solid currentColor;border-bottom:2px solid currentColor;border-radius:0;transform:rotate(-45deg);animation:none}body.is-error .mark{background:#842f35}.eyebrow{margin:0 0 9px;color:#806e60;font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0 0 11px;font:500 35px/1.04 Georgia,"Times New Roman",serif;color:#220d50}p{margin:0;color:#75665b;font-size:14px;line-height:1.65}.detail{margin-top:17px;padding:13px 14px;border-radius:14px;background:#f7f0e7;color:#6a594c;font-size:11px;line-height:1.55;overflow-wrap:anywhere}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:21px}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:999px;background:#220d50;color:#fff;text-decoration:none;font-size:12px;font-weight:800}.actions a.secondary{background:#eee3d5;color:#241d19}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.mark:before{animation:none}}
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true"></span>
    <p class="eyebrow">Secure PayMongo checkout</p>
    <h1 id="title">Confirming your payment…</h1>
    <p id="message">Your browser has returned from PayMongo. We are waiting for the verified payment notice before activating the order.</p>
    <p class="detail" id="detail">Please keep this page open for a moment.</p>
    <div class="actions"><a href="./" class="secondary">Return to the book</a><a href="../ebook/" id="ebookLink" hidden>Open ebook app</a></div>
  </main>
<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://wjnavdpppnhxbuydkrkd.supabase.co',SUPABASE_KEY='sb_publishable_bpdFntTHbHmxsG4L0PtcCw_5dJ8gpr8',API=SUPABASE_URL+'/functions/v1/book-paymongo-api',AUTH='trwtl.auth';
  var title=document.getElementById('title'),message=document.getElementById('message'),detail=document.getElementById('detail'),ebookLink=document.getElementById('ebookLink');
  var order=new URLSearchParams(location.search).get('order')||'';
  function read(){try{return JSON.parse(localStorage.getItem(AUTH)||'null')}catch(e){return null}}
  function write(v){try{localStorage.setItem(AUTH,JSON.stringify(v))}catch(e){}}
  function clear(){try{localStorage.removeItem(AUTH)}catch(e){}}
  async function refresh(s){if(!s||!s.refresh_token)return null;try{var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'content-type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token}),cache:'no-store'});if(!r.ok)throw new Error();var d=await r.json(),n={access_token:d.access_token,refresh_token:d.refresh_token||s.refresh_token,expires_at:Math.floor(Date.now()/1000)+Number(d.expires_in||3600)};write(n);return n}catch(e){clear();return null}}
  async function session(){var s=read();if(!s)return null;if(!s.expires_at||Number(s.expires_at)<Math.floor(Date.now()/1000)+90)s=await refresh(s);return s}
  async function status(){var s=await session();if(!s)throw new Error('sign_in_required');var r=await fetch(API,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+s.access_token,'content-type':'application/json'},body:JSON.stringify({action:'status',order_id:order}),cache:'no-store'}),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'unavailable');return d}
  function paid(d){document.body.classList.add('is-paid');var o=d.order||{},edition=o.edition||'';title.textContent='Payment confirmed';if(edition==='ebook'){message.textContent='Your ebook access is now active. Your private one-click ebook email is being sent to the order email.';ebookLink.hidden=false}else{message.textContent='Your pocketbook payment is confirmed. Your order can now move to fulfillment.'}detail.textContent='Order '+(o.id||order)+' · '+String(o.status||'paid').replace(/_/g,' ')}
  function pending(){title.textContent='Payment received by PayMongo';message.textContent='We are still waiting for PayMongo’s signed webhook to confirm the order. This usually completes within moments.';detail.textContent='Do not send payment proof. The webhook, not the browser redirect, is the source of truth.'}
  function fail(){document.body.classList.add('is-error');title.textContent='Payment status is still pending';message.textContent='The checkout returned successfully, but this device could not verify the order yet. If payment completed, PayMongo will still send the confirmation to our backend.';detail.textContent='You do not need to pay again. Check your email shortly or return to the book and reopen the order status.'}
  async function run(){if(!/^[0-9a-f-]{36}$/i.test(order)){fail();return}for(var i=0;i<12;i++){try{var d=await status(),o=d.order||{};if(o.status==='paid'||o.status==='shipped'){paid(d);return}pending()}catch(e){if(e.message==='sign_in_required'){fail();return}}await new Promise(function(resolve){setTimeout(resolve,2000)})}fail()}
  run();
})();
</script>
</body>
</html>
