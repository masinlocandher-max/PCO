<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#fbf5e8">
  <title>Secure sign-in | The Right Way to Live</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#fbf5e8;color:#2a211a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(430px,100%);padding:28px;border:1px solid #d7c6ae;border-radius:24px;background:#fffaf1;box-shadow:0 24px 70px rgba(36,23,12,.12)}small{display:block;margin-bottom:10px;color:#8a6339;font-weight:700;letter-spacing:.13em;text-transform:uppercase}h1{margin:0 0 12px;font:600 34px/1.05 Georgia,serif}p{margin:0;color:#695747;font-size:15px;line-height:1.6}a{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:999px;background:#2a211a;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <small>Protected Book Order</small>
    <h1 id="title">Securing your sign-in…</h1>
    <p id="message">Please keep this page open for a moment.</p>
    <a id="back" href="./">Return to the book</a>
  </main>
  <script>
    (function(){
      'use strict';
      var title=document.getElementById('title'),message=document.getElementById('message'),back=document.getElementById('back');
      function safeReturn(){
        try{
          var saved=JSON.parse(localStorage.getItem('trwtl.auth-return')||'null');
          localStorage.removeItem('trwtl.auth-return');
          if(saved&&typeof saved.path==='string'&&/^\.\/\?order=(ebook|pocketbook)$/.test(saved.path)&&Date.now()-Number(saved.created_at||0)<30*60*1000)return saved.path;
        }catch(e){}
        return './';
      }
      function fail(text){title.textContent='Sign-in could not be completed';message.textContent=text;back.hidden=false;}
      try{
        var params=new URLSearchParams(location.hash.slice(1));
        var access=params.get('access_token'),refresh=params.get('refresh_token');
        if(!access||!refresh){
          var error=params.get('error_description')||params.get('error');
          fail(error?'The secure link was not accepted. Please request a new one.':'This secure sign-in link is incomplete. Please request a new one.');
          return;
        }
        var raw=access.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');raw=raw.padEnd(Math.ceil(raw.length/4)*4,'=');
        var claims=JSON.parse(atob(raw));
        var expiresAt=Number(params.get('expires_at'))||Number(claims.exp)||Math.floor(Date.now()/1000)+Number(params.get('expires_in')||3600);
        localStorage.setItem('trwtl.auth',JSON.stringify({access_token:access,refresh_token:refresh,expires_at:expiresAt}));
        history.replaceState(null,'',location.pathname);
        var destination=safeReturn();
        title.textContent='Signed in securely';
        message.textContent='Returning you to your order now.';
        back.href=destination;back.textContent='Return to your order';
        setTimeout(function(){location.replace(destination);},180);
      }catch(e){fail('The sign-in response could not be verified on this device. Please request a new secure link.');}
    })();
  </script>
</body>
</html>
