<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f8f2e8">
  <title>Admin sign-in | The Right Way to Live</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:20px;background:#f4ede3;color:#241d19;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}.card{width:min(440px,100%);padding:30px;border:1px solid #ded1c2;border-radius:25px;background:#fffdf9;box-shadow:0 20px 70px rgba(43,28,15,.09);text-align:center}.icon{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 18px;border-radius:18px;background:#220d50;color:#fff}.icon:before{content:"";width:19px;height:19px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}body.ok .icon:before{width:17px;height:9px;border:0;border-left:2px solid currentColor;border-bottom:2px solid currentColor;border-radius:0;transform:rotate(-45deg);animation:none}body.bad .icon{background:#842f35}.eyebrow{margin:0 0 9px;color:#806e60;font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0 0 10px;font:500 31px/1.06 Georgia,"Times New Roman",serif;color:#220d50}p{margin:0;color:#75665b;font-size:14px;line-height:1.6}a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:20px;padding:0 18px;border-radius:999px;background:#220d50;color:#fff;text-decoration:none;font-size:12px;font-weight:800}a[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.icon:before{animation:none}}
  </style>
</head>
<body>
  <main class="card">
    <span class="icon" aria-hidden="true"></span>
    <p class="eyebrow">Private administration</p>
    <h1 id="title">Securing admin sign-in…</h1>
    <p id="message">Please keep this page open for a moment.</p>
    <a id="back" href="./" hidden>Return to Book Admin</a>
  </main>
<script>
(function(){
  'use strict';
  var STORE='trwtl.book.admin',title=document.getElementById('title'),message=document.getElementById('message'),back=document.getElementById('back');
  function fail(){history.replaceState(null,'',location.pathname);document.body.classList.add('bad');title.textContent='Admin sign-in could not be completed';message.textContent='This secure link is incomplete or no longer valid. Return to Book Admin and request a fresh link.';back.hidden=false}
  try{
    var p=new URLSearchParams(location.hash.slice(1)),access=p.get('access_token'),refresh=p.get('refresh_token');
    if(!access||!refresh){fail();return}
    var raw=access.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');raw=raw.padEnd(Math.ceil(raw.length/4)*4,'=');var claims=JSON.parse(atob(raw));
    var exp=Number(p.get('expires_at'))||Number(claims.exp)||Math.floor(Date.now()/1000)+Number(p.get('expires_in')||3600);
    localStorage.setItem(STORE,JSON.stringify({access_token:access,refresh_token:refresh,expires_at:exp}));
    history.replaceState(null,'',location.pathname);document.body.classList.add('ok');title.textContent='Admin sign-in complete';message.textContent='Opening the private order dashboard now.';back.hidden=false;
    setTimeout(function(){location.replace('./')},window.matchMedia('(prefers-reduced-motion: reduce)').matches?100:550);
  }catch(e){fail()}
})();
</script>
</body>
</html>
