<!doctype html>

  <style>
    :root{--bg:#fbf6ec;--paper:#fffdf8;--ink:#2d251f;--muted:#76695e;--line:#c9a76e;--plum:#220d50;--step:1}html[data-theme="sepia"]{--bg:#f1e2c9;--paper:#f7ecd8;--ink:#36291f;--muted:#75614f}html[data-theme="night"]{--bg:#15110e;--paper:#1d1814;--ink:#f4eadf;--muted:#baaa9b;--line:#97723a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}.bar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:44px 1fr 44px 44px;align-items:center;min-height:64px;padding:env(safe-area-inset-top) 10px 0;background:rgba(251,246,236,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(143,105,50,.35)}html[data-theme="night"] .bar{background:rgba(21,17,14,.94)}.bar button,.bar a{appearance:none;border:0;background:transparent;color:var(--ink);width:44px;height:44px;display:grid;place-items:center;text-decoration:none;font:600 22px/1 system-ui,sans-serif}.bar-title{text-align:center;margin:0;font-size:18px;line-height:1.2;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}.progress{position:fixed;left:0;top:calc(64px + env(safe-area-inset-top));height:2px;width:100%;z-index:31}.progress i{display:block;height:100%;width:0;background:var(--line)}main{width:min(760px,100%);margin:0 auto;padding:42px 34px 96px}.chapter-meta{display:block;margin-bottom:18px;font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(40px,8vw,68px);line-height:.98;font-weight:400;margin:0 0 24px;letter-spacing:-.035em}.rule{display:block;width:72px;height:2px;background:var(--line);margin:0 0 36px}.prose{font-size:calc(22px * var(--step));line-height:1.72}.prose p{margin:0 0 1.35em}.loading{min-height:62vh;display:grid;place-items:center;text-align:center}.loading strong{display:block;font-size:34px;font-weight:400;margin-bottom:10px}.loading span{display:block;font:14px/1.6 system-ui,sans-serif;color:var(--muted)}.error-card{max-width:520px;margin:12vh auto 0;padding:30px;border:1px solid rgba(143,105,50,.28);border-radius:24px;background:var(--paper);text-align:center}.error-card h1{font-size:38px}.error-card p{font:15px/1.65 system-ui,sans-serif;color:var(--muted)}.error-card a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:999px;background:var(--plum);color:#fff;text-decoration:none;font:700 12px/1 system-ui,sans-serif}.panel{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}.panel[data-open]{display:block}.panel-head{position:sticky;top:0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid rgba(143,105,50,.28)}.panel-head h2{text-align:center;margin:0;font-size:21px;font-weight:400}.panel-head button{border:0;background:transparent;color:var(--ink);font-size:24px;height:44px}.panel-body{width:min(680px,100%);margin:auto;padding:26px 22px 60px}.toc-part{margin:28px 0 10px;font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.toc-item{width:100%;display:grid;grid-template-columns:40px 1fr;gap:8px;text-align:left;border:0;border-bottom:1px solid rgba(143,105,50,.2);background:transparent;color:var(--ink);padding:15px 0;font:16px/1.35 system-ui,sans-serif}.toc-item b{font-size:11px;color:var(--muted)}.toc-item.is-active span{font-weight:700;color:var(--plum)}.prefs{display:grid;gap:24px}.pref h3{font:700 12px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;margin:0 0 12px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid rgba(143,105,50,.38);background:var(--paper);color:var(--ink);border-radius:999px;padding:11px 15px;font:600 13px/1 system-ui,sans-serif}.chip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:35;width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:7px;padding:7px;border:1px solid rgba(143,105,50,.3);border-radius:22px;background:rgba(255,253,248,.94);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(30,20,10,.13)}html[data-theme="night"] .nav{background:rgba(29,24,20,.94)}.nav button{border:0;background:transparent;color:var(--ink);border-radius:16px;padding:12px 8px;font:700 12px/1 system-ui,sans-serif}.nav button:nth-child(2){background:var(--plum);color:#fff}.nav button:disabled{opacity:.35}.watermark{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);gap:80px;transform:rotate(-24deg) scale(1.25);opacity:.035}.watermark span{font:700 10px/1 system-ui,sans-serif;white-space:nowrap;color:var(--ink)}.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#21180f;color:#fff;border-radius:999px;padding:11px 16px;font:600 12px/1.2 system-ui,sans-serif;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.shield{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-items:center;text-align:center}.shield.show{display:grid}.shield strong{font-size:30px;font-weight:400}.shield span{display:block;margin-top:8px;font:14px/1.5 system-ui,sans-serif;color:var(--muted)}@media(max-width:560px){main{padding:34px 24px 90px}.prose{font-size:calc(20px * var(--step))}.bar-title{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="bar"><a href="/book/" aria-label="Back">‹</a><p class="bar-title" id="barTitle">The Right Way to Live</p><button id="prefsBtn" type="button" aria-label="Reading preferences">☰</button><button id="tocBtn" type="button" aria-label="Contents">⌑</button></header>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <main id="main"><div class="loading" id="loading"><div><strong>Opening your copy</strong><span>Your private ebook is opening on this device.</span></div></div><article id="doc" hidden></article></main>
  <section class="panel" id="tocPanel" aria-hidden="true"><div class="panel-head"><span></span><h2>Contents</h2><button type="button" data-close="toc">×</button></div><div class="panel-body" id="tocBody"></div></section>
  <section class="panel" id="prefsPanel" aria-hidden="true"><div class="panel-head"><span></span><h2>Reading</h2><button type="button" data-close="prefs">×</button></div><div class="panel-body prefs"><div class="pref"><h3>Text size</h3><div class="chips"><button class="chip" data-step="0.9">Small</button><button class="chip" data-step="1">Default</button><button class="chip" data-step="1.15">Large</button><button class="chip" data-step="1.3">Larger</button></div></div><div class="pref"><h3>Page colour</h3><div class="chips"><button class="chip" data-theme="day">Day</button><button class="chip" data-theme="sepia">Sepia</button><button class="chip" data-theme="night">Night</button></div></div><div class="pref"><h3>Access</h3><p style="margin:0;font:14px/1.6 system-ui,sans-serif;color:var(--muted)">This device keeps your ebook access. No registration or account setup is required.</p></div></div></section>
  <nav class="nav" id="nav" hidden><button id="prevBtn" type="button">Previous</button><button id="contentsBtn" type="button">Contents</button><button id="nextBtn" type="button">Next</button></nav>
  <div class="watermark" id="watermark" aria-hidden="true"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="shield" id="shield"><div><strong>Your page is held</strong><span>Return to this window to continue reading.</span></div></div>
  <script>
  (function(){'use strict';
    var API='https://wjnavdpppnhxbuydkrkd.supabase.co/functions/v1/book-gift-api',SESSION='trwtl.gift.session',EMAIL='trwtl.gift.email',PROGRESS='trwtl.gift.progress',PREF='trwtl.gift.prefs';
    var manifest=[],session='',email='',current=null,timer=null;var main=document.getElementById('main'),loading=document.getElementById('loading'),doc=document.getElementById('doc'),tocPanel=document.getElementById('tocPanel'),tocBody=document.getElementById('tocBody'),prefsPanel=document.getElementById('prefsPanel'),nav=document.getElementById('nav'),progress=document.getElementById('progress'),barTitle=document.getElementById('barTitle'),watermark=document.getElementById('watermark'),toast=document.getElementById('toast'),shield=document.getElementById('shield');
    function read(k){try{return localStorage.getItem(k)||''}catch(e){return''}}function write(k,v){try{localStorage.setItem(k,v)}catch(e){}}function remove(k){try{localStorage.removeItem(k)}catch(e){}}function readJ(k){try{return JSON.parse(read(k))||null}catch(e){return null}}function writeJ(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
    function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function toastMsg(m){toast.textContent=m;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){toast.classList.remove('show')},2500)}
    async function api(action,payload){var r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({action:action},payload||{})),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'}),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'service_unavailable');return d}
    function token(){var p=new URLSearchParams(location.hash.charAt(0)==='#'?location.hash.slice(1):'');var t=p.get('gift')||'';return/^[0-9a-f]{64}$/.test(t)?t:''}function strip(){if(location.hash)history.replaceState(null,'',location.pathname+location.search)}
    function fail(title,copy){strip();loading.hidden=true;doc.hidden=true;nav.hidden=true;main.innerHTML='<section class="error-card"><h1>'+esc(title)+'</h1><p>'+esc(copy)+'</p><a href="mailto:withlovefmb@gmail.com?subject=Ebook%20access">Request a new access email</a></section>'}
    function clean(t){return String(t||'').replace(/^PART\s+[IVX]+:\s*/i,'').replace(/^Interlude:\s*/i,'').replace(/^\d{2}\.\s*/,'')}function rows(){return manifest.filter(function(r){return r.kind!=='part'})}
    function toc(){tocBody.innerHTML='';manifest.forEach(function(r){if(r.kind==='part'){var p=document.createElement('p');p.className='toc-part';p.textContent=String(r.title||'').replace(/^PART\s+[IVX]+:\s*/i,'');tocBody.appendChild(p);return}var b=document.createElement('button');b.type='button';b.className='toc-item';b.dataset.sequence=String(r.sequence);var n=document.createElement('b'),m=/^(\d{2})\.\s*/.exec(r.title||'');n.textContent=m?m[1]:'·';var s=document.createElement('span');s.textContent=clean(r.title);b.appendChild(n);b.appendChild(s);tocBody.appendChild(b)})}
    function active(s){tocBody.querySelectorAll('[data-sequence]').forEach(function(b){b.classList.toggle('is-active',Number(b.dataset.sequence)===Number(s))})}function wm(){watermark.innerHTML='';if(!email)return;for(var i=0;i<48;i++){var x=document.createElement('span');x.textContent=('PERSONAL COPY · '+email).toUpperCase();watermark.appendChild(x)}}
    function prefs(){var p=readJ(PREF)||{},step=Number(p.step)||1,theme=p.theme||'day';document.documentElement.style.setProperty('--step',String(step));if(theme==='day')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);document.querySelectorAll('[data-step]').forEach(function(b){b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step))});document.querySelectorAll('[data-theme]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.theme===theme))})}
    function updateNav(){var a=rows(),i=a.findIndex(function(r){return Number(r.sequence)===Number(current)});document.getElementById('prevBtn').disabled=i<=0;document.getElementById('nextBtn').disabled=i<0||i>=a.length-1}function markProgress(){if(!current)return;var max=document.documentElement.scrollHeight-innerHeight,p=max>0?Math.max(0,Math.min(100,scrollY/max*100)):0;progress.style.width=p.toFixed(2)+'%';writeJ(PROGRESS,{sequence:current,percent:Number(p.toFixed(2))})}
    function render(ch,pct){doc.innerHTML='';var meta=document.createElement('span');meta.className='chapter-meta';meta.textContent=ch.kind==='chapter'?'Chapter':'The Right Way to Live';var h=document.createElement('h1');h.textContent=clean(ch.title);var rule=document.createElement('span');rule.className='rule';var prose=document.createElement('div');prose.className='prose';String(ch.body||'').split(/\n{2,}/).forEach(function(t){if(!t.trim())return;var p=document.createElement('p');p.textContent=t.trim();prose.appendChild(p)});doc.appendChild(meta);doc.appendChild(h);doc.appendChild(rule);doc.appendChild(prose);doc.hidden=false;loading.hidden=true;nav.hidden=false;current=Number(ch.sequence);barTitle.textContent=h.textContent;active(current);updateNav();wm();requestAnimationFrame(function(){var max=document.documentElement.scrollHeight-innerHeight;scrollTo(0,max>0?max*Math.max(0,Math.min(100,Number(pct)||0))/100:0);markProgress()})}
    async function open(sequence,pct){try{toastMsg('Opening chapter…');var d=await api('chapter',{session:session,sequence:Number(sequence)});render(d.chapter,pct||0);close(tocPanel)}catch(e){if(e.message==='access_required'){remove(SESSION);remove(EMAIL);fail('Your access needs a fresh link','For security, this device no longer has an active ebook session.')}else toastMsg('This chapter could not be opened right now.')}}
    function panel(p){p.setAttribute('data-open','');p.setAttribute('aria-hidden','false')}function close(p){p.removeAttribute('data-open');p.setAttribute('aria-hidden','true')}function move(d){var a=rows(),i=a.findIndex(function(r){return Number(r.sequence)===Number(current)}),t=a[i+d];if(t)open(t.sequence,0)}
    function wire(){document.getElementById('tocBtn').onclick=function(){panel(tocPanel)};document.getElementById('contentsBtn').onclick=function(){panel(tocPanel)};document.getElementById('prefsBtn').onclick=function(){panel(prefsPanel)};document.querySelector('[data-close="toc"]').onclick=function(){close(tocPanel)};document.querySelector('[data-close="prefs"]').onclick=function(){close(prefsPanel)};tocBody.onclick=function(e){var b=e.target.closest('[data-sequence]');if(b)open(Number(b.dataset.sequence),0)};document.getElementById('prevBtn').onclick=function(){move(-1)};document.getElementById('nextBtn').onclick=function(){move(1)};document.querySelectorAll('[data-step]').forEach(function(b){b.onclick=function(){var p=readJ(PREF)||{};p.step=Number(b.dataset.step);writeJ(PREF,p);prefs()}});document.querySelectorAll('[data-theme]').forEach(function(b){b.onclick=function(){var p=readJ(PREF)||{};p.theme=b.dataset.theme;writeJ(PREF,p);prefs()}});var tick=false;addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){markProgress();tick=false})},{passive:true});['copy','cut','contextmenu','dragstart'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();if(t==='copy')toastMsg('This personal copy cannot be copied out.')})});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')shield.classList.add('show');else setTimeout(function(){shield.classList.remove('show')},120)});addEventListener('beforeprint',function(){shield.classList.add('show')});addEventListener('afterprint',function(){shield.classList.remove('show')})}
    async function stored(){var s=read(SESSION);if(!/^[0-9a-f]{64}$/.test(s))return null;try{var d=await api('access',{session:s});if(d.has_access!==true||d.content_ready!==true)return null;session=s;email=d.email||read(EMAIL);manifest=Array.isArray(d.chapters)?d.chapters:[];return d}catch(e){return null}}
    async function exchange(t){var d=await api('exchange',{token:t});if(!d.session||!Array.isArray(d.chapters))throw new Error('invalid_access_link');session=d.session;email=d.email||'';manifest=d.chapters;write(SESSION,session);write(EMAIL,email);strip();return d}
    async function start(){wire();prefs();var t=token(),a=await stored();if(!a&&t){try{a=await exchange(t)}catch(e){if(e.message==='access_link_expired')fail('This access link has expired','Ask FMB for a fresh complimentary access email.');else fail('This private link is no longer active','The link may already have been opened on another device. Ask FMB for a fresh access email.');return}}if(!a){fail('Open the ebook from your access email','This app does not use registration. Open the private button in your complimentary or paid access email.');return}toc();wm();var p=readJ(PROGRESS)||{},r=rows(),first=r.find(function(x){return Number(x.sequence)===Number(p.sequence)})||r[0];if(!first){fail('The ebook is not available yet','Please try again shortly.');return}await open(first.sequence,Number(p.percent)||0)}
    start().catch(function(){fail('The ebook could not open','Please use the access email again. If the problem continues, ask FMB to resend it.')});
  })();
  </script>
